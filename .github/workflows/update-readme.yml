name: Update README projects

on:
  schedule:
    - cron: "0 6 * * *"  
  workflow_dispatch:      
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Générer la liste des projets récents
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Récupère tes dépôts, triés par date de dernière activité
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: 'DylanBrass',
              per_page: 100,
              sort: 'pushed',
              direction: 'desc',
            });

            // Ignore les forks et les dépôts archivés, garde les 5 plus récents
            const top = repos
              .filter(r => !r.fork && !r.archived)
              .slice(0, 5);

            const emojiFor = (lang) => {
              const map = {
                'fortran':'📊', 'C': '🇨', 'C++': '💻', 'C#': '🛠️', 'Java': '☕',
                'TypeScript': '📘', 'JavaScript': '📜', 'Python': '🐍',
                'HTML': '🖼️', 'ShaderLab': '🎮',
              };
              return map[lang] || '📦';
            };

            const lines = top.map(r => {
              const desc = r.description ? ` — ${r.description}` : '';
              const emoji = emojiFor(r.language);
              return `- ${emoji} **[${r.name}](${r.html_url})**${desc}`;
            });

            const block = lines.join('\n');

            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(
              /<!--START_PROJECTS-->[\s\S]*?<!--END_PROJECTS-->/,
              `<!--START_PROJECTS-->\n${block}\n<!--END_PROJECTS-->`
            );
            fs.writeFileSync('README.md', readme);

      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: mise à jour automatique des projets"
          git push
